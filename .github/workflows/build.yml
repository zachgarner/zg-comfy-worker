name: build-workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "build only this model (pony|illustrious), or blank for all"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        model: [pony, illustrious, chroma1-hd]
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        id: g
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ] || [ "$only" = "${{ matrix.model }}" ]; then echo "run=yes" >> $GITHUB_OUTPUT; else echo "run=no" >> $GITHUB_OUTPUT; fi
      - name: Free disk
        if: steps.g.outputs.run == 'yes'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/.ghcup /usr/lib/jvm /opt/az || true
      - uses: docker/setup-buildx-action@v3
        if: steps.g.outputs.run == 'yes'
      - uses: docker/login-action@v3
        if: steps.g.outputs.run == 'yes'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.g.outputs.run == 'yes'
        with:
          context: .
          file: Dockerfile.${{ matrix.model }}
          push: true
          tags: ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.model }}
          cache-from: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.model }}-cache
          cache-to: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.model }}-cache,mode=max
          secrets: |
            civitai=${{ secrets.CIVITAI_TOKEN }}
