name: build-pony-worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/lib/jvm /opt/az || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/zg-claude/muse-comfy-worker:pony
          cache-from: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:buildcache,mode=max
          secrets: |
            civitai=${{ secrets.CIVITAI_TOKEN }}
